[package]
name = "crawde"
version = "0.1.0"
description = "A small crab companion for Claude Code"
authors = ["Joe"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "crawde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
